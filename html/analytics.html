<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="../img/bhivelogo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales and Reports</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/cliq-ui.css">
    <link rel="stylesheet" href="../css/analytics.css">
</head>
<body>
    <main class="reports-page">
        <section class="reports-hero">
            <div>
                <p class="reports-eyebrow">Sales Intelligence</p>
                <h1>Reports</h1>
                <p>Review analytics, sales summaries, archive records, payment usage, order type trends, and popular menu items.</p>
            </div>
        </section>

        <nav class="report-buttons" aria-label="Report views">
            <button id="view-analytics-report" type="button">
                <i class="fa-solid fa-chart-simple"></i>
                <span>Analytics</span>
            </button>
            <button id="view-weekly-report" type="button">
                <i class="fa-solid fa-calendar-week"></i>
                <span>Weekly</span>
            </button>
            <button id="view-monthly-report" type="button">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Monthly</span>
            </button>
            <button id="view-annual-report" type="button">
                <i class="fa-solid fa-chart-line"></i>
                <span>Annual</span>
            </button>
            <button id="view-archive-records" type="button">
                <i class="fa-solid fa-box-archive"></i>
                <span>Archive</span>
            </button>
        </nav>

        <section id="report-content" aria-live="polite">
            <div class="report-loading">Loading analytics...</div>
        </section>
    </main>

    <div id="confirmation-modal" class="modal">
        <div class="modal-content">
            <p id="modal-message">Are you sure you want to delete this record?</p>
            <div class="modal-actions">
                <button id="modal-confirm-btn" class="modal-btn confirm">Confirm</button>
                <button id="modal-cancel-btn" class="modal-btn cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Classic Firebase SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-analytics.js"></script>

    <!-- Your config -->
    <script src="../js/firebase-config.js"></script>

    <script type="module" src="../js/analytics.js"></script>
    <script src="../js/cliq-layout.js"></script>
</body>
</html>
