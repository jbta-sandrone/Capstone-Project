<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="../img/bhivelogo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="../css/adminfeedback.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/cliq-ui.css">
</head>
<body>
    <main class="feedback-shell">
        <section class="feedback-panel">
            <div class="feedback-panel__header">
                <div>
                    <p class="feedback-eyebrow">Admin Inbox</p>
                    <h1>Customer Feedback</h1>
                    <p>Review recent customer notes and manage them from one polished workspace.</p>
                </div>
                <div class="feedback-pill">Live updates</div>
            </div>

            <div class="feedback-list-card">
                <div class="customer-entries feedback-entries" id="customer-entries"></div>
            </div>
        </section>
    </main>

    <div id="success" class="success" style="display: none;">Deleted successfully!</div>

    <div id="confirmation-modal" class="modal">
        <div class="modal-content">
            <p id="modal-message">Are you sure you want to delete this record?</p>
            <div class="modal-actions">
                <button id="modal-confirm-btn" class="modal-btn confirm">Confirm</button>
                <button id="modal-cancel-btn" class="modal-btn cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-analytics.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script type="module" src="../js/adminfeedback.js"></script>
    <script src="../js/cliq-layout.js"></script>
</body>
</html>
